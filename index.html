<!doctype html>
<html lang="de">

<head>
    <!-- ================================
         GRUNDKONFIGURATION
    ================================= -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>KlassenCloud</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <!-- =========================================================
         1. LOGIN & REGISTRIERUNG
    ========================================================== -->

    <section id="authScreen" class="auth-screen">

        <div class="auth-card">

            <!-- LOGO -->
            <div class="brand auth-brand">
                <span class="brand-icon">☁</span>

                <div>
                    <strong>KlassenCloud</strong>
                    <small>Dein sicherer Klassen-Hub</small>
                </div>
            </div>


            <!-- LOGIN & REGISTRIERUNG -->
            <div class="auth-grid">

                <!-- =========================
                     LOGIN
                ========================== -->

                <form id="loginForm" class="auth-form auth-panel">

                    <div>
                        <span class="auth-kicker">
                            BEREITS DABEI?
                        </span>

                        <h1>Anmelden</h1>

                        <p class="muted">
                            Melde dich mit deinem Namen und Passwort an.
                        </p>
                    </div>


                    <!-- Benutzername -->
                    <input
                        class="input"
                        name="name"
                        placeholder="Dein Name"
                        autocomplete="username"
                        required
                    >


                    <!-- Passwort -->
                    <input
                        class="input"
                        name="password"
                        type="password"
                        placeholder="Passwort"
                        autocomplete="current-password"
                        required
                    >


                    <!-- Login Button -->
                    <button class="primary">
                        Anmelden
                    </button>


                    <!-- Fehlermeldung -->
                    <div
                        id="loginError"
                        class="auth-error">
                    </div>

                </form>



                <!-- =========================
                     REGISTRIERUNG
                ========================== -->

                <form id="registerForm" class="auth-form auth-panel">

                    <div>
                        <span class="auth-kicker">
                            NEU HIER?
                        </span>

                        <h1>Konto erstellen</h1>

                        <p class="muted">
                            Registriere dich mit deinem Namen,
                            deiner Klasse und einem Passwort.
                        </p>
                    </div>


                    <!-- Vor- und Nachname -->
                    <input
                        class="input"
                        name="name"
                        placeholder="Vor- und Nachname"
                        required
                    >


                    <!-- Klasse -->
                    <input
                        class="input"
                        name="className"
                        placeholder="Klasse, z. B. 8A"
                        value="8A"
                        required
                    >


                    <!-- Passwort -->
                    <input
                        class="input"
                        name="password"
                        type="password"
                        minlength="8"
                        placeholder="Passwort (mind. 8 Zeichen)"
                        required
                    >


                    <!-- Registrieren Button -->
                    <button class="primary">
                        Registrieren
                    </button>


                    <!-- Fehlermeldung -->
                    <div
                        id="registerError"
                        class="auth-error">
                    </div>

                </form>

            </div>

        </div>

    </section>



    <!-- =========================================================
         2. SEITENLEISTE / NAVIGATION
    ========================================================== -->

    <aside
        class="sidebar"
        id="sidebar">


        <!-- LOGO -->
        <div class="brand">

            <span class="brand-icon">
                ☁
            </span>

            <div>
                <strong>KlassenCloud</strong>
                <small>Deine Klasse. Dein Hub.</small>
            </div>

        </div>



        <!-- =========================
             HAUPTNAVIGATION
        ========================== -->

        <nav id="nav">

            <!-- Dashboard -->
            <button
                class="nav-item active"
                data-view="dashboard">

                ⌂
                <span>Dashboard</span>

            </button>


            <!-- Chats -->
            <button
                class="nav-item"
                data-view="chat">

                💬
                <span>Chats</span>

            </button>


            <!-- Cloud -->
            <button
                class="nav-item"
                data-view="cloud">

                ▣
                <span>Cloud</span>

            </button>


            <!-- Gruppen -->
            <button
                class="nav-item"
                data-view="groups">

                👥
                <span>Gruppen</span>

            </button>


            <!-- Termine -->
            <button
                class="nav-item"
                data-view="calendar">

                ▦
                <span>Termine</span>

            </button>


            <!-- Stundenplan -->
            <button
                class="nav-item"
                data-view="timetable">

                🕐
                <span>Stundenplan</span>

            </button>


            <!-- Profil -->
            <button
                class="nav-item"
                data-view="profile">

                ◉
                <span>Profil</span>

            </button>


            <!-- =========================
                 ADMIN
                 Wird nur angezeigt,
                 wenn der Benutzer Admin ist.
            ========================== -->

            <button
                class="nav-item"
                data-view="admin"
                id="adminNav"
                hidden>

                🛡
                <span>Admin</span>

            </button>

        </nav>



        <!-- =====================================================
             UNTERE NAVIGATION
        ====================================================== -->

        <div class="sidebar-bottom">

            <!-- Darstellung / Dark Mode -->
            <button
                class="nav-item"
                id="themeBtn">

                ☾
                <span>Darstellung</span>

            </button>


            <!-- Abmelden -->
            <button
                class="nav-item"
                id="logoutBtn">

                ⇥
                <span>Abmelden</span>

            </button>

        </div>

    </aside>



    <!-- =========================================================
         3. HAUPTBEREICH
    ========================================================== -->

    <main class="main">


        <!-- =========================
             OBERER BEREICH
        ========================== -->

        <header class="topbar">


            <!-- Mobile Menü -->
            <button
                class="mobile-menu"
                id="mobileMenu"
                aria-label="Navigation öffnen">

                ☰

            </button>



            <!-- Sidebar ein-/ausblenden -->
            <button
                class="sidebar-toggle"
                id="sidebarToggle"
                aria-label="Dashboard-Navigation ein-/ausblenden"
                title="Navigation ein-/ausblenden">

                ☰
                <span>Dashboard</span>

            </button>



            <!-- Breadcrumb / aktuelle Seite -->
            <div
                class="breadcrumbs"
                id="breadcrumbs">

                Dashboard

            </div>



            <!-- =========================
                 RECHTS OBEN
            ========================== -->

            <div class="top-actions">

                <!-- Profil-Schnellzugriff -->
                <button
                    class="avatar"
                    id="profileQuick">

                    A

                </button>

            </div>

        </header>



        <!-- =====================================================
             4. APP-INHALT

             Dashboard, Chat, Cloud, Gruppen usw.
             werden hier per JavaScript geladen.
        ====================================================== -->

        <section
            id="app"
            class="content">

            <!-- Inhalt wird von js/app.js eingefügt -->

        </section>

    </main>



    <!-- =========================================================
         5. BENACHRICHTIGUNGEN / TOASTS
    ========================================================== -->

    <div
        class="toast-container"
        id="toasts">

        <!-- Toast-Nachrichten werden hier eingefügt -->

    </div>



    <!-- =========================================================
         6. JAVASCRIPT
    ========================================================== -->

    <script src="js/app.js"></script>

</body>

</html>
