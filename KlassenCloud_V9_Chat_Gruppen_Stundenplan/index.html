<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KlassenCloud</title><link rel="stylesheet" href="css/style.css"></head><body>
<section id="authScreen" class="auth-screen"><div class="auth-card"><div class="brand auth-brand"><span class="brand-icon">☁</span><div><strong>KlassenCloud</strong><small>Dein sicherer Klassen-Hub</small></div></div><div class="auth-tabs"><button id="loginTab" class="auth-tab active">Anmelden</button><button id="registerTab" class="auth-tab">Registrieren</button></div>
<form id="loginForm" class="auth-form"><h1>Willkommen zurück</h1><p class="muted">Zum Anmelden brauchst du nur deinen <b>Namen</b> und dein Passwort.</p><input class="input" name="name" placeholder="Dein Name" autocomplete="username" required><input class="input" name="password" type="password" placeholder="Passwort" autocomplete="current-password" required><button class="primary">Anmelden</button><div id="loginError" class="auth-error"></div></form>
<form id="registerForm" class="auth-form" hidden><h1>Konto erstellen</h1><p class="muted">Nutze deinen echten Namen und eine vorhandene Klasse.</p><input class="input" name="name" placeholder="Vor- und Nachname" required><input class="input" name="className" placeholder="Klasse, z. B. 8A" value="8A" required><input class="input" name="password" type="password" minlength="8" placeholder="Passwort (mind. 8 Zeichen)" required><button class="primary">Registrieren</button><div id="registerError" class="auth-error"></div></form><p class="demo-login"> <b></b> · <b></b></p></div></section>
<aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-icon">☁</span><div><strong>KlassenCloud</strong><small>Deine Klasse. Dein Hub.</small></div></div><nav id="nav"><button class="nav-item active" data-view="dashboard">⌂ <span>Dashboard</span></button><button class="nav-item" data-view="chat">💬 <span>Chats</span></button><button class="nav-item" data-view="cloud">▣ <span>Cloud</span></button><button class="nav-item" data-view="groups">👥 <span>Gruppen</span></button><button class="nav-item" data-view="calendar">▦ <span>Termine</span></button><button class="nav-item" data-view="timetable">🕐 <span>Stundenplan</span></button><button class="nav-item" data-view="profile">◉ <span>Profil</span></button><button class="nav-item" data-view="admin" id="adminNav" hidden>🛡 <span>Admin</span></button></nav><div class="sidebar-bottom"><button class="nav-item" id="themeBtn">☾ <span>Darstellung</span></button><button class="nav-item" id="logoutBtn">⇥ <span>Abmelden</span></button></div></aside>
<main class="main"><header class="topbar"><button class="mobile-menu" id="mobileMenu">☰</button><div class="breadcrumbs" id="breadcrumbs">Dashboard</div><div class="top-actions"><button class="avatar" id="profileQuick">A</button></div></header><section id="app" class="content"></section></main><div class="toast-container" id="toasts"></div>
<script src="js/app.js"></script></body></html>
